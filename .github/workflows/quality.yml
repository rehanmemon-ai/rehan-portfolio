name: Quality Gate & Site Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint & Automated Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24"

      - name: Install Pinned Quality Dependencies
        run: |
          python -m pip install --no-deps -r .github/requirements-ci.txt
          npm ci --ignore-scripts

      - name: Verify JavaScript Syntax
        run: |
          node --check site.js
          node --check theme-init.js

      - name: Run Deterministic Site Generator
        run: python -B build_site.py

      - name: Verify Working Tree Determinism
        run: test -z "$(git status --porcelain -- *.html sitemap.xml robots.txt)"

      - name: Run Structural & Link Integrity Checker
        run: python -B check_site.py

      - name: Run Unit & Regression Test Suite
        run: python -m pytest tests/

      - name: Run Python AST Linting (Ruff)
        run: python -m ruff check build_site.py check_site.py tests/

      - name: Run Static Security Analysis (Bandit)
        run: python -m bandit -r build_site.py check_site.py tests/ -ll -q

      - name: Validate HTML5 Syntax (html-validate)
        run: npx --no-install html-validate *.html
