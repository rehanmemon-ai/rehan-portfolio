    <rect x="418" y="48" width="154" height="76" rx="10"/>
    <rect x="618" y="48" width="154" height="76" rx="10"/>
    <rect x="818" y="48" width="164" height="76" rx="10"/>
  </g>
  <g class="label">
    <text x="95" y="79">FastAPI &amp;</text><text x="95" y="103">WebSockets</text>
    <text x="295" y="79">In-memory</text><text x="295" y="103">presence</text>
    <text x="495" y="79">Async</text><text x="495" y="103">SQLAlchemy 2.1</text>
    <text x="695" y="79">Gemini AI</text><text x="695" y="103">summaries</text>
    <text x="900" y="79">JSONB cosine</text><text x="900" y="103">vector search</text>
  </g>
  <g class="arrow">
    <path d="M180 86h28m-9-9 9 9-9 9"/>
