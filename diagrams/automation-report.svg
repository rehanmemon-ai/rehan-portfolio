<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="172" viewBox="0 0 1000 172" role="img" aria-labelledby="title desc">
  <title id="title">Lead Brief Document Flow</title>
  <desc id="desc">Spreadsheet row or subworkflow trigger, format and filter data, create a Google Doc, export PDF, then route to a Gmail notification node. The diagram does not indicate successful execution.</desc>
  <style>
    .bg { fill: #f1f7f4; }
    .box { fill: #ffffff; stroke: #8ab6b2; stroke-width: 2px; }
    .label { fill: #142029; font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 650; text-anchor: middle; }
    .arrow { stroke: #087b83; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #132228; }
      .box { fill: #1c2e35; stroke: #45676e; }
      .label { fill: #eef4f0; }
      .arrow { stroke: #70d8d0; }
    }
  </style>
  <rect class="bg" width="1000" height="172" rx="18"/>
  <g class="box">
    <rect x="18" y="48" width="154" height="76" rx="10"/>
    <rect x="218" y="48" width="154" height="76" rx="10"/>
    <rect x="418" y="48" width="154" height="76" rx="10"/>
    <rect x="618" y="48" width="154" height="76" rx="10"/>
    <rect x="818" y="48" width="164" height="76" rx="10"/>
  </g>
  <g class="label">
    <text x="95" y="79">Sheet event</text><text x="95" y="103">or subflow</text>
    <text x="295" y="79">Format &amp;</text><text x="295" y="103">filter data</text>
    <text x="495" y="79">Create</text><text x="495" y="103">Google Doc</text>
    <text x="695" y="79">Export</text><text x="695" y="103">PDF</text>
    <text x="900" y="79">Gmail</text><text x="900" y="103">node</text>
  </g>
  <g class="arrow">
    <path d="M180 86h28m-9-9 9 9-9 9"/>
    <path d="M380 86h28m-9-9 9 9-9 9"/>
    <path d="M580 86h28m-9-9 9 9-9 9"/>
    <path d="M780 86h28m-9-9 9 9-9 9"/>
  </g>
</svg>
