<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="172" viewBox="0 0 1000 172" role="img" aria-labelledby="title desc">
  <title id="title">Signature verification processing pipeline</title>
  <desc id="desc">CEDAR-format images go through OpenCV preprocessing, 331 handcrafted features, StandardScaler and an RBF support vector machine, then writer-disjoint evaluation.</desc>
  <rect width="1000" height="172" rx="18" fill="#f1f7f4"/>
  <g fill="#fff" stroke="#8ab6b2" stroke-width="2"><rect x="18" y="48" width="154" height="76" rx="10"/><rect x="218" y="48" width="154" height="76" rx="10"/><rect x="418" y="48" width="154" height="76" rx="10"/><rect x="618" y="48" width="154" height="76" rx="10"/><rect x="818" y="48" width="164" height="76" rx="10"/></g>
  <g fill="#142029" font-family="system-ui,sans-serif" font-size="17" font-weight="650" text-anchor="middle"><text x="95" y="79">Signature</text><text x="95" y="103">images</text><text x="295" y="79">OpenCV</text><text x="295" y="103">preprocessing</text><text x="495" y="79">331 features</text><text x="495" y="103">extracted</text><text x="695" y="79">Scaled</text><text x="695" y="103">RBF SVM</text><text x="900" y="79">Writer-disjoint</text><text x="900" y="103">evaluation</text></g>
  <g fill="none" stroke="#087b83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M180 86h28m-9-9 9 9-9 9"/><path d="M380 86h28m-9-9 9 9-9 9"/><path d="M580 86h28m-9-9 9 9-9 9"/><path d="M780 86h28m-9-9 9 9-9 9"/></g>
</svg>
