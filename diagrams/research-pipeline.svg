<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="172" viewBox="0 0 1000 172" role="img" aria-labelledby="title desc">
  <title id="title">Research assistant component flow</title>
  <desc id="desc">Documents are parsed and normalized, split into chunks, embedded into Chroma, retrieved for a question and mapped to citations. End-to-end integration and evaluation remain open.</desc>
  <rect width="1000" height="172" rx="18" fill="#f1f7f4"/>
  <g fill="#fff" stroke="#8ab6b2" stroke-width="2"><rect x="18" y="48" width="154" height="76" rx="10"/><rect x="218" y="48" width="154" height="76" rx="10"/><rect x="418" y="48" width="154" height="76" rx="10"/><rect x="618" y="48" width="154" height="76" rx="10"/><rect x="818" y="48" width="164" height="76" rx="10"/></g>
  <g fill="#142029" font-family="system-ui,sans-serif" font-size="17" font-weight="650" text-anchor="middle"><text x="95" y="79">Parse &amp;</text><text x="95" y="103">normalize</text><text x="295" y="79">Chunk</text><text x="295" y="103">documents</text><text x="495" y="79">Embed &amp;</text><text x="495" y="103">store in Chroma</text><text x="695" y="79">Retrieve</text><text x="695" y="103">context</text><text x="900" y="79">Map source</text><text x="900" y="103">citations</text></g>
  <g fill="none" stroke="#087b83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M180 86h28m-9-9 9 9-9 9"/><path d="M380 86h28m-9-9 9 9-9 9"/><path d="M580 86h28m-9-9 9 9-9 9"/><path d="M780 86h28m-9-9 9 9-9 9"/></g>
</svg>
